<svg xmlns="http://www.w3.org/2000/svg" width="680" height="224" viewBox="0 0 680 224" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>ocsh : mini-shell en C</title><desc>Banniere ocsh : fenetre de terminal avec le logo ocsh, un curseur clignotant, des phrases qui s'ecrivent lettre par lettre et la chaine fork, execvp, pipe, dup2, waitpid, sur un fond sombre avec pluie de code et circuits.</desc><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.r{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:3px;will-change:transform;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{from{transform:translateY(-230px)}to{transform:translateY(250px)}}
.cp{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:7 93;animation:cp 3s linear infinite}
